<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonOps AI</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Eco-tech palette: black, forest charcoal, lime green, soft white. */
:root {
  --bg: #101412; --surface: #1A211D; --surface-2: #202823; --ink: #F5F7F5; --ink-2: #D2DAD4; --muted: #94A39A; --line: #303B33; --line-2: #262F29;
  --side-bg: #151C18; --side-ink: #E3E9E4; --side-mute: #94A39A; --side-hover: rgba(245, 247, 245, 0.06); --side-active: #B7F34A; --side-strong: #101412; --side-bar: #B7F34A;
  --top-bg: #101412; --top-ink: #F5F7F5; --top-line: #303B33;
  --forest: #B7F34A; --forest-2: #C4F76A; --on-forest: #101412; --navy: #000000;
  --emerald: #34D399; --emerald-bg: #0F2E22; --amber: #FBBF24; --amber-bg: #2E2410; --red: #F87171; --red-bg: #3A1717;
  --blue: #60A5FA; --blue-bg: #13243A; --violet: #C4B5FD; --violet-bg: #251D3F; --grey-bg: #1F2725;
  --s1: #FB923C; --s2: #38BDF8; --s3: #A78BFA;
  --c1: #38BDF8; --c2: #FB923C; --c3: #FACC15; --c4: #22D3EE; --c5: #A78BFA; --c6: #94A3B8; --c7: #F472B6; --c8: #A3E635;
  --dg2: #10B981; --dg1: #14532D; --dn: #26302D; --dr1: #7F2D20; --dr2: #EF4444;
  --h0: #134E4A; --h1: #0F9F78; --h2: #EAB308; --h3: #F97316; --h4: #EF4444;
  --grid: #27302A; --tick: #94A39A; --hl: rgba(183, 243, 74, 0.12); --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  --ground: #161D19; --ground-line: #303B33; --face-shade: rgba(0, 0, 0, 0.25); --face-shade-2: rgba(0, 0, 0, 0.45);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --r-sm: 6px;
  --on-ver: #04140B;
  color-scheme: dark;
}
:root[data-ui="light"] {
  --bg: #E9F0E8; --surface: #FFFFFF; --surface-2: #F3F7F2; --ink: #0B0D0C; --ink-2: #232A25; --muted: #5A665C; --line: #D3DDD2; --line-2: #E4EBE3;
  --top-bg: #000000; --top-ink: #FFFFFF; --top-line: #1F2620;
  --forest: #B7F34A; --forest-2: #4D7C0F; --on-forest: #101412; --on-ver: #FFFFFF;
  --emerald: #0E8A5F; --emerald-bg: #DCF5E9; --amber: #A15C07; --amber-bg: #FDF1D6; --red: #C0262D; --red-bg: #FDE4E2;
  --blue: #1D5FD1; --blue-bg: #E1EBFD; --violet: #6D3FD6; --violet-bg: #EEE8FD; --grey-bg: #EEF2F0;
  --s1: #EA580C; --s2: #0284C7; --s3: #7C3AED;
  --c1: #0284C7; --c2: #EA580C; --c3: #CA8A04; --c4: #0891B2; --c5: #7C3AED; --c6: #64748B; --c7: #DB2777; --c8: #65A30D;
  --dg2: #059669; --dg1: #A7E3C9; --dn: #E5EAE8; --dr1: #F8C4B4; --dr2: #DC2626;
  --h0: #CDEFE2; --h1: #6FD3A9; --h2: #FACC15; --h3: #FB923C; --h4: #DC2626;
  --grid: #E1E8E0; --tick: #5A665C; --hl: rgba(132, 204, 22, 0.12); --shadow: 0 1px 2px rgba(15, 26, 23, 0.06), 0 2px 8px rgba(15, 26, 23, 0.04);
  --ground: #DDE6DC; --ground-line: #C3D0C2; --face-shade: rgba(10, 25, 20, 0.14); --face-shade-2: rgba(10, 25, 20, 0.28);
  color-scheme: light;
}
:root[data-ui="light"] body { background-image: radial-gradient(1200px 500px at 85% -10%, rgba(132,204,22,0.08), transparent 60%), radial-gradient(900px 400px at 0% 110%, rgba(2,132,199,0.05), transparent 60%); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); background-image: radial-gradient(1200px 500px at 85% -10%, rgba(190,246,90,0.06), transparent 60%), radial-gradient(900px 400px at 0% 110%, rgba(56,189,248,0.05), transparent 60%); background-attachment: fixed; font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
.num, .mono, td.n, .kpi-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--forest-2); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); box-shadow: inset -1px 0 0 rgba(0,0,0,0.25); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-block: 16px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #0B0D0C; display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--font-display); font-size: 16px; color: var(--side-strong); letter-spacing: 0.01em; display: block; line-height: 1.1; }
.brand small { font-size: 10.5px; color: var(--side-mute); letter-spacing: 0.06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.nav-sec { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--side-mute); padding: 14px 10px 6px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; color: var(--side-ink); }
.nav button:hover { background: var(--side-hover); }
.nav button.on { background: var(--side-active); color: var(--side-strong); font-weight: 600; box-shadow: inset 3px 0 0 var(--side-bar); }
.nav button:focus-visible { outline: 2px solid var(--side-bar); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: 0.9; }
.nav .count { margin-left: auto; font: 500 11px var(--font-mono); background: #BEF65A; color: #0B0D0C; padding: 1px 6px; border-radius: 10px; }
.side-foot { margin-top: auto; padding: 14px 18px 0; font-size: 11.5px; color: var(--side-mute); line-height: 1.45; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--top-bg); color: var(--top-ink); border-bottom: 1px solid var(--top-line); display: flex; align-items: center; gap: 10px; padding: 10px 20px; flex-wrap: wrap; }
.top .sel { display: flex; flex-direction: column; gap: 1px; }
.top .sel label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA8B6; }
.top select { background: #111; color: #fff; border-color: #333; }
.top .data-status { background: #111; border-color: #2a2a2a; color: #C9D3DD; }
.top .icon-btn { color: #fff; }
.top .icon-btn:hover { background: #1a1a1a; }
.top .profile small { color: #9AA8B6; }
select, input[type=text], input[type=number], input[type=date], input[type=search], input[type=email], input[type=password], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 9px; min-height: 34px; max-width: 100%; }
select:focus, input:focus, textarea:focus { border-color: var(--forest-2); outline: none; box-shadow: 0 0 0 3px var(--hl); }
.top select { min-width: 0; font-weight: 500; }
.top .grow { flex: 1; }
.data-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
.dot.ok { background: var(--emerald); }
.icon-btn { all: unset; cursor: pointer; position: relative; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }
.badge-n { position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: #fff; font: 600 10px/16px var(--font-mono); text-align: center; padding: 0 3px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--forest); color: var(--on-forest); display: grid; place-items: center; font: 600 12px var(--font-display); }
.profile { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.2; }
.profile small { color: var(--muted); display: block; }
.menu-btn { display: none; }
.content { padding: 20px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1480px; width: 100%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; min-height: 34px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--forest); color: var(--on-forest); border-color: var(--forest); }
.btn.primary:hover { background: var(--forest-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 9px; min-height: 28px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Page head */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 700; }
.page-head p { margin: 3px 0 0; color: var(--muted); max-width: 72ch; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.demo-banner { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 12px; flex-wrap: wrap; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 0; flex-wrap: wrap; }
.card-h h3 { font-size: 14px; font-weight: 600; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.card-b { padding: 12px 14px 14px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.alerts-scroll { max-height: 470px; overflow-y: auto; }
.g-twin { grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); }
.g-sim { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; }
.span2 { grid-column: span 2; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.kpi { padding: 12px 14px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kpi:nth-child(5n) { border-right: 0; }
.kpi.lead { background: var(--surface-2); }
.kpi-l { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi-val { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; }
.kpi-val small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.kpi-f { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.delta { font: 500 11.5px var(--font-mono); }
.delta.up { color: var(--red); } .delta.down { color: var(--emerald); } .delta.flat { color: var(--muted); }
.delta.up.good { color: var(--emerald); } .delta.down.bad { color: var(--red); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid transparent; line-height: 1.6; }
.st-measured { background: var(--blue-bg); color: var(--blue); }
.st-imported { background: var(--grey-bg); color: var(--ink-2); border-color: var(--line); }
.st-calculated { background: var(--emerald-bg); color: var(--emerald); }
.st-estimated { background: var(--amber-bg); color: var(--amber); }
.st-simulated { background: var(--violet-bg); color: var(--violet); border: 1px dashed var(--violet); }
.st-verified { background: var(--emerald); color: var(--on-ver); }
.st-review, .st-provisional { background: var(--red-bg); color: var(--red); }
.st-illustrative { background: var(--amber-bg); color: var(--amber); border: 1px dashed var(--amber); }
.st-documented { background: var(--emerald-bg); color: var(--emerald); }
.st-derived { background: var(--blue-bg); color: var(--blue); }
.st-missing { background: var(--red-bg); color: var(--red); }
.conf-High { background: var(--emerald-bg); color: var(--emerald); }
.conf-Medium { background: var(--amber-bg); color: var(--amber); }
.conf-Low, .conf-Insufficient { background: var(--red-bg); color: var(--red); }
.legend-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }

/* Charts */
.chart { width: 100%; min-height: 60px; position: relative; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .tick { fill: var(--tick); font: 10.5px var(--font-mono); }
.chart .unit { fill: var(--muted); font: 10.5px var(--font-body); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.dash { stroke-dasharray: 5 4; }
.chart .area { opacity: 0.12; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart [data-chart-click] { cursor: pointer; }
.chart .hl { fill: var(--hl); }
.chart .bar.dim { opacity: 0.45; }
.chart .hatch { mask: url(#hatch-mask); }
.hb-fill.hatch { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255,255,255,0.5) 3px 6px); }
.chart .arc { fill: none; cursor: pointer; }
.chart .arc:hover { opacity: 0.85; }
.d-big { fill: var(--ink); font: 600 17px var(--font-mono); }
.d-sub { fill: var(--muted); font: 10.5px var(--font-body); }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.d-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; min-width: 140px; flex: 1; }
.d-legend li { display: flex; align-items: center; gap: 7px; }
.d-legend i, .legend i, #tt i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.d-legend b { margin-left: auto; font: 500 12px var(--font-mono); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i.dash { height: 2px; width: 14px; }
.chart-empty { display: grid; place-items: center; min-height: 140px; color: var(--muted); font-size: 12.5px; border: 1px dashed var(--line); border-radius: 6px; }
.hbars { display: flex; flex-direction: column; gap: 4px; }
.hbar { all: unset; display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) 64px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 4px; border-radius: 4px; min-width: 0; }
button.hbar { cursor: pointer; }
button.hbar:hover, .hbar.active { background: var(--surface-2); }
.hbar.active { box-shadow: inset 2px 0 0 var(--forest-2); }
.hb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { height: 12px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.hb-fill { display: block; height: 100%; border-radius: 3px; }
.hb-val { font: 500 12px var(--font-mono); text-align: right; }
#tt { position: fixed; z-index: 100; pointer-events: none; border: 1px solid #2A3038; background: var(--navy); color: #EAF1F4; font-size: 12px; padding: 7px 9px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); line-height: 1.45; }
#tt div { display: flex; align-items: center; gap: 6px; }
#tt .tt-total { border-top: 1px solid rgba(255,255,255,0.15); margin-top: 3px; padding-top: 3px; }

/* Alerts */
.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line-2); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.alert:hover { background: var(--surface-2); }
.alert .bar { border-radius: 2px; }
.alert b { font-size: 13px; font-weight: 600; display: block; }
.alert span { font-size: 12px; color: var(--muted); }
.sev-critical .bar { background: var(--red); } .sev-warning .bar { background: var(--amber); } .sev-opportunity .bar { background: var(--emerald); } .sev-info .bar { background: var(--blue); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--hl); }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lab { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.slider label { font-size: 12.5px; color: var(--ink-2); }
.slider output { font: 500 12px var(--font-mono); color: var(--ink); text-align: right; }
.slider input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--forest-2); }
.slider .hint { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
legend.grp { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 12.5px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--forest); color: var(--on-forest); }
.seg button:focus-visible { outline: 2px solid var(--forest-2); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--forest-2); }

/* Notices */
.note { font-size: 12.5px; padding: 9px 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.note.warn { background: var(--amber-bg); border-color: transparent; color: var(--amber); }
.note.err { background: var(--red-bg); border-color: transparent; color: var(--red); }
.note.ok { background: var(--emerald-bg); border-color: transparent; color: var(--emerald); }
.note.sim { background: var(--violet-bg); border: 1px dashed var(--violet); color: var(--violet); }
.note b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.formula { font: 12px/1.6 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 5px 14px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--forest-2); font-weight: 500; }

/* Twin */
.twin-wrap { position: relative; }
.twin svg { width: 100%; height: auto; display: block; }
.twin .bld { cursor: pointer; }
.twin .bld:hover .top-face { filter: brightness(1.06); }
.twin .bld .edge { fill: none; stroke: var(--ink); stroke-opacity: 0.18; stroke-width: 0.8; }
.twin .bld.sel .edge { stroke: var(--ink); stroke-opacity: 0.9; stroke-width: 2; }
.twin .lbl { font: 600 10.5px var(--font-body); fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.twin .lbl2 { font: 500 10px var(--font-mono); fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.twin .shade1 { fill: var(--face-shade); } .twin .shade2 { fill: var(--face-shade-2); }
.twin .groundp { fill: var(--ground); stroke: var(--ground-line); }
.twin .road { fill: none; stroke: var(--ground-line); stroke-width: 1; stroke-dasharray: 4 4; }
.twin.scn .bld .edge { stroke: var(--violet); stroke-opacity: 0.6; stroke-dasharray: 3 2; }
.heat-scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.heat-scale i { width: 22px; height: 8px; display: inline-block; }
.twin-tag { position: absolute; top: 10px; left: 12px; }
.metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.metric { background: var(--surface); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.metric span { font-size: 11px; color: var(--muted); }
.metric b { font: 500 15px var(--font-mono); }

/* Planner */
.rec { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.rec-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; cursor: pointer; align-items: start; }
.rec-h h3 { font-size: 15px; font-weight: 600; }
.rec-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
.rec-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-2); }
.rec-nums > div { padding: 8px 14px; border-right: 1px solid var(--line-2); min-width: 0; }
.rec-nums > div:last-child { border-right: 0; }
.rec-nums span { font-size: 11px; color: var(--muted); display: block; }
.rec-nums b { font: 500 15px var(--font-mono); }
.rec-nums .na { font: 12px var(--font-body); color: var(--muted); }
.rec-body { border-top: 1px solid var(--line-2); padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px 22px; }
.rec-body h4 { font: 600 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.rec-body p, .rec-body ul { margin: 0; font-size: 13px; }
.rec-body ul { padding-left: 18px; }
.pipeline { display: flex; gap: 0; flex-wrap: wrap; }
.pipeline button { all: unset; cursor: pointer; font-size: 11.5px; padding: 4px 9px; border: 1px solid var(--line); margin-left: -1px; color: var(--muted); }
.pipeline button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
.pipeline button:last-child { border-radius: 0 5px 5px 0; }
.pipeline button.done { color: var(--ink-2); background: var(--surface-2); }
.pipeline button.on { background: var(--forest); color: var(--on-forest); border-color: var(--forest); }
.pipeline button.rej.on { background: var(--red); border-color: var(--red); }
.pipeline button[disabled] { cursor: not-allowed; opacity: 0.45; }
.pill { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--grey-bg); color: var(--ink-2); white-space: nowrap; }
.pill.s-Under.review { background: var(--blue-bg); color: var(--blue); }
.pill.on { background: var(--forest); color: var(--on-forest); }

/* Advisor */
.chat { display: flex; flex-direction: column; gap: 12px; min-height: 320px; max-height: 62vh; overflow-y: auto; padding: 14px; }
.msg { max-width: 82ch; font-size: 13.5px; line-height: 1.55; }
.msg.u { align-self: flex-end; background: var(--forest); color: var(--on-forest); padding: 8px 12px; border-radius: 12px 12px 3px 12px; }
.msg.a { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px 12px 12px 3px; }
.msg.a p { margin: 0 0 8px; } .msg.a p:last-child { margin: 0; }
.msg.a ul, .msg.a ol { margin: 0 0 8px; padding-left: 20px; }
.msg.a h4 { font-size: 13.5px; margin: 8px 0 4px; }
.msg .src { font-size: 11px; color: var(--muted); margin-top: 6px; display: block; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { all: unset; cursor: pointer; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.chips button:hover { border-color: var(--forest-2); color: var(--forest-2); }
.composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-height: 40px; resize: vertical; }
.typing::after { content: "▍"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Vision */
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--surface-2); }
.drop.over { border-color: var(--forest-2); background: var(--hl); }
.preview { max-height: 300px; width: 100%; object-fit: contain; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--forest-2); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 32px; max-width: 920px; }
.report h2 { font-size: 20px; } .report h3 { font-size: 14.5px; margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid var(--line-2); }
.report p { max-width: 75ch; }

/* Modal, drawer, toast */
.scrim { position: fixed; inset: 0; background: rgba(8, 18, 16, 0.45); z-index: 60; display: flex; justify-content: flex-end; }
.drawer { background: var(--surface); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 18px 20px; padding-block: calc(18px + env(safe-area-inset-top, 0px)) 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: -8px 0 30px rgba(0,0,0,0.2); }
.scrim.center { justify-content: center; align-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; width: min(560px, 100%); max-height: 86vh; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--navy); color: #EAF1F4; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 120; box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: calc(100% - 32px); }
.notif { position: absolute; top: 46px; right: 0; width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,0.18); z-index: 40; max-height: 70vh; overflow-y: auto; }
.rel { position: relative; }
.target-bar { position: relative; height: 10px; background: var(--line-2); border-radius: 5px; margin: 8px 0 4px; }
.target-bar .fillx { position: absolute; left: 0; top: 0; bottom: 0; background: var(--emerald); border-radius: 5px; }
.target-bar .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }

/* Plain-language layer */
.help { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font: 600 10px var(--font-body); cursor: help; vertical-align: 1px; flex: none; background: var(--surface); }
.help:hover, .help:focus-visible { border-color: var(--forest-2); color: var(--forest-2); }
.good-t { color: var(--emerald); } .bad-t { color: var(--red); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.sec-title h2 { font-size: 16px; font-weight: 700; }
.story { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; min-width: 0; }
.q-num { width: 30px; height: 30px; border-radius: 50%; background: var(--forest); color: var(--on-forest); display: grid; place-items: center; font: 700 14px var(--font-display); }
.q-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.q-body p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.q-q { font: 700 15.5px var(--font-display); }
.q-big { font: 500 34px/1.05 var(--font-mono); letter-spacing: -0.02em; }
.q-big small { font: 400 13px var(--font-body); color: var(--muted); letter-spacing: 0; }
.split-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 2px; }
.split-bar span { display: block; min-width: 3px; }
.split-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.split-legend li { display: flex; align-items: center; gap: 6px; }
.split-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.split-legend b { margin-left: auto; font: 500 13px var(--font-mono); }
.todo { margin: 0; padding: 0; list-style: none; counter-reset: t; display: flex; flex-direction: column; gap: 6px; }
.todo button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-weight: 600; }
.todo button:hover, .todo button:focus-visible { border-color: var(--forest-2); background: var(--hl); }
.todo-n { font: 400 12px var(--font-mono); color: var(--emerald); }
.kpi-group { display: flex; flex-direction: column; gap: 6px; }
.kpi-gl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.takeaway { margin: 4px 14px 0; font-size: 12.5px; color: var(--ink-2); }
.target-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.target-nums span { display: block; font-size: 11.5px; color: var(--muted); }
.target-nums b { font: 500 15px var(--font-mono); }
.howto { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 9px 12px; }
.plan-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.plan-sum > div { padding: 14px 16px; border-right: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan-sum > div:last-child { border-right: 0; }
.plan-sum span { font-size: 12px; color: var(--muted); }
.plan-sum b { font: 500 22px var(--font-mono); letter-spacing: -0.01em; }
.plan-sum small { font-size: 11.5px; color: var(--muted); }
.pick { border-top: 3px solid var(--forest-2); }
.pick-n { width: 24px; height: 24px; border-radius: 50%; background: var(--forest); color: var(--on-forest); display: grid; place-items: center; font: 700 12px var(--font-display); flex: none; }
.pick-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface-2); border-radius: 6px; padding: 8px; }
.pick-nums b { font: 500 14px var(--font-mono); display: block; }
.pick-nums span { font-size: 11px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.tag-quick { background: var(--emerald-bg); color: var(--emerald); }
.tag-big { background: var(--blue-bg); color: var(--blue); }
.tag-data { background: var(--amber-bg); color: var(--amber); }
.tag-chg { background: var(--violet-bg); color: var(--violet); font-weight: 500; }
.pill.act { background: var(--blue-bg); color: var(--blue); }
.rec-rej { opacity: 0.7; }
.rec-what { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); max-width: 90ch; }
.rec-more { font-size: 12px; color: var(--forest-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-weight: 500; }
.rec-more svg { width: 15px; height: 15px; }
.impact { display: block; height: 5px; background: var(--line-2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.impact i { display: block; height: 100%; background: var(--emerald); border-radius: 3px; }
.conf-t-High { color: var(--emerald); } .conf-t-Medium { color: var(--amber); } .conf-t-Low, .conf-t-Insufficient { color: var(--red); }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.st-step { font-size: 11.5px; padding: 3px 9px; border-radius: 12px; background: var(--line-2); color: var(--muted); }
.st-step.done { background: var(--emerald-bg); color: var(--emerald); }
.st-step.on { background: var(--forest); color: var(--on-forest); font-weight: 600; }
.st-step.rej.on { background: var(--red); }
.chips.filt button { display: inline-flex; gap: 6px; align-items: center; }
.chips.filt button span { font: 500 11px var(--font-mono); color: var(--muted); }
.chips.filt button.on { background: var(--forest); color: var(--on-forest); border-color: var(--forest); }
.chips.filt button.on span { color: inherit; opacity: 0.8; }
.chips.filt button[disabled] { opacity: 0.4; cursor: default; }
details > summary { cursor: pointer; }
.assume { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; }
.assume summary { font-size: 12.5px; font-weight: 500; }
.presets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.presets button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); font-size: 13px; }
.presets button span { font-size: 12px; color: var(--muted); }
.presets button:hover, .presets button:focus-visible { border-color: var(--violet); background: var(--violet-bg); }
.step-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--forest); color: var(--on-forest); font: 700 12px var(--font-display); margin-right: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; cursor: pointer; font-size: 13px; }
.opt input { margin-top: 3px; accent-color: var(--violet); }
.opt > span { display: flex; flex-direction: column; gap: 1px; }
.opt.on { border-color: var(--violet); background: var(--violet-bg); }
.grp-d { border: 1px solid var(--line-2); border-radius: 6px; padding: 9px 11px; }
.grp-d summary { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 13px; list-style: none; flex-wrap: wrap; }
.grp-d summary::-webkit-details-marker { display: none; }
.grp-d summary::before { content: "▸"; margin-right: 6px; color: var(--muted); }
.grp-d[open] summary::before { content: "▾"; }
.grp-d summary > span:first-child { flex: 1; }
.sim-head { border-color: var(--violet); }
.sim-sentence { margin: 0; font-size: 15px; line-height: 1.5; }
.ba { display: flex; flex-direction: column; gap: 6px; }
.ba-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 82px; gap: 10px; align-items: center; font-size: 12.5px; }
.ba-row b { font: 500 13px var(--font-mono); text-align: right; }
.ba-track { height: 16px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.ba-track i { display: block; height: 100%; border-radius: 4px; transition: width 0.25s; }
.sim-fill { background: var(--violet); background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,0.28) 4px 8px); }
.big4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.big4 > div { background: var(--surface); padding: 9px 11px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.big4 span { font-size: 11.5px; color: var(--muted); }
.big4 b { font: 500 18px var(--font-mono); }
.big4 small { font-size: 11px; color: var(--muted); }
.changes { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
@media (min-width: 1201px) { .sim-head { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); z-index: 5; } }
@media (max-width: 1200px) { .story { grid-template-columns: minmax(0, 1fr); } .presets { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .plan-sum, .big4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .plan-sum > div:nth-child(2) { border-right: 0; } .presets { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ba-row { grid-template-columns: 96px minmax(0, 1fr) 70px; } }
/* Carousel: swipeable big-number cards */
.car { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.car-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.car-title h2 { font-size: 16px; font-weight: 700; }
.car-title { display: flex; flex-direction: column; gap: 2px; }
.car-ctl { display: flex; align-items: center; gap: 6px; }
.car-count { font: 500 12px var(--font-mono); color: var(--muted); min-width: 44px; text-align: right; margin-right: 4px; }
.car-btn { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
.car-btn:hover:not([disabled]) { border-color: var(--forest-2); color: var(--forest-2); }
.car-btn:focus-visible { outline: 2px solid var(--forest-2); outline-offset: 2px; }
.car-btn[disabled] { opacity: 0.35; cursor: default; }
.car-btn svg { width: 18px; height: 18px; }
.car-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 2px 2px 6px; scrollbar-width: none; overscroll-behavior-x: contain; }
.car-track::-webkit-scrollbar { display: none; }
.car-track:focus-visible { outline: 2px solid var(--forest-2); outline-offset: 2px; border-radius: var(--r); }
.slide { flex: 0 0 min(330px, 86%); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.slide::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--acc); }
.sl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sl-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.sl-tag { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sl-rank { font: 600 12px var(--font-mono); color: var(--muted); }
.sl-name { font: 700 20px/1.2 var(--font-display); text-wrap: balance; }
.sl-big { font: 700 40px/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.sl-big small { font: 500 13px var(--font-body); color: var(--muted); letter-spacing: 0; }
.sl-share { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sl-share b { font: 700 15px var(--font-display); color: var(--ink); }
.sl-bar { display: block; height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.sl-bar i { display: block; height: 100%; background: var(--acc); border-radius: 4px; }
.sl-text { margin: 0; font-size: 13px; color: var(--ink-2); flex: 1; }
.sl-foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; border-top: 1px solid var(--line-2); padding-top: 9px; }
.sl-chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* ===== Page transitions and sign-in entrance ===== */

.main { position: relative; }
.route-bar { position: absolute; top: 0; left: 0; height: 2px; width: 100%; z-index: 40; pointer-events: none; opacity: 0; background: linear-gradient(90deg, transparent, #5EEAD4 30%, #B7F34A 60%, #E6FFB0 80%, transparent); box-shadow: 0 0 12px rgba(183,243,74,.7); transform-origin: left; }

@keyframes ae-side { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }

  background: radial-gradient(circle at 50% 52%, rgba(240,255,210,.95) 0%, rgba(183,243,74,.75) 22%, rgba(16,20,18,.98) 70%); }

/* ===== Overview (bento: five questions) ===== */
.ov2 { display: flex; flex-direction: column; gap: 14px; }

.ov-span { grid-column: 1 / -1; }

.ov-dots { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(183,243,74,.14) 1px, transparent 1.4px); background-size: 14px 14px; -webkit-mask-image: radial-gradient(ellipse at 85% 25%, #000 10%, transparent 60%); mask-image: radial-gradient(ellipse at 85% 25%, #000 10%, transparent 60%); }
.ov-hero { padding: 22px 26px; }

.ov-big { font: 800 clamp(52px, 6vw, 78px)/1 Inter, sans-serif; letter-spacing: -.045em; background: linear-gradient(120deg, #F2FFE0, #B7F34A 55%, #5EEAD4); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(183,243,74,.22)); font-variant-numeric: tabular-nums; }

.ov-trend { width: 100%; height: 150px; display: block; }

.ov-stats { display: flex; gap: 26px; margin-top: 8px; flex-wrap: wrap; }
.ov-stats > div > span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); } .ov-stats > div > span i { width: 8px; height: 8px; border-radius: 2px; }

.ov-src { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: center; }
.ov-donut { width: 170px; height: 170px; } .ov-dt { fill: #E8F0E9; } [data-ui="light"] .ov-dt { fill: #101412; }
.ovc.in .ov-seg { animation: ov-seg 1.1s cubic-bezier(.2,.8,.2,1) both; } .ovc.rv:not(.in) .ov-seg { opacity: 0; }

.ov-li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; }
.ov-li:hover, .ov-ar:hover { background: rgba(255,255,255,.03); }

.ov-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; }

.ov-ic.up { background: #24151A; color: #FDA4AF; border: 1px solid #5B2A33; } .ov-ic.down { background: rgba(183,243,74,.08); color: #CFF89A; border: 1px solid rgba(183,243,74,.3); }
.ov-iso { width: 100%; height: 150px; display: block; margin: -6px 0 6px; }
.ov-blk { cursor: pointer; transition: filter .2s; } .ov-blk:hover { filter: brightness(1.25); }
